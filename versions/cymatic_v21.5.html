    <script type="module">
    // ============================================================
    // 1. IMPORTS
    // ============================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ============================================================
    // 2. ESTADO GLOBAL
    // ============================================================
    let versionActual = '24';
    let modoDimension = 1;
    let modoCuantico = false;
    let figuraIndex = 0;
    const FIGURAS = ['Chladni', 'Lissajous', 'Espiral', 'Mandala', 'Aurora'];
    let visualActual = 'spectrum';
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let nivelAudio = 0;
    let synthActivo = false;
    let osciladores = [];
    let filtroLowPass = null;
    let filtroHighPass = null;
    let waveform = 'sine';
    let frecuenciaBase = 440;
    let oscActive = false;
    let oscCanvas = document.getElementById('oscilloscope');
    let oscCtx = oscCanvas.getContext('2d');

    let scene, camera, renderer, composer, controls;
    let pointsMesh, terrain, refLine;
    let geometry, material;
    const COUNT = 3000;
    let boids = [];
    let cristales = [];
    let mouseX = 0, mouseY = 0;
    let teclas = {};
    let lastTime = performance.now();
    let frameCount = 0;
    let matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*';
    let matrixDrop = [];

    // ============================================================
    // 3. DOM
    // ============================================================
    const container = document.getElementById('canvas-container');
    const logArea = document.getElementById('logArea');
    const fftContainer = document.getElementById('fftMeter');
    const FFT_SIZE = 24;
    for (let i = 0; i < FFT_SIZE; i++) {
        const bar = document.createElement('div');
        bar.className = 'fft-bar';
        fftContainer.appendChild(bar);
    }
    const fftBars = fftContainer.querySelectorAll('.fft-bar');

    function guardarLog(msg, highlight = false) {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="highlight">[${time}]</span> ${highlight ? '<span class="highlight">' + msg + '</span>' : msg}`;
        logArea.prepend(entry);
        if (logArea.children.length > 40) logArea.removeChild(logArea.lastChild);
    }
    guardarLog('🚀 CYMATIC RETRO EDITION iniciada', true);
    guardarLog('🎛️ Visualizadores: Espectro, Partículas, Matrix, Vectores, Ondas');

    // ============================================================
    // 4. VERSIONES
    // ============================================================
    const VERSIONES = {
        '1.0': { nombre: 'Quantum Seed', desc: 'HTML estático' },
        '3.0': { nombre: 'Cymatic Core', desc: 'Canvas 2D' },
        '8.0': { nombre: 'Quantum Bloom', desc: 'Multi‑filamentos' },
        '15.0': { nombre: 'Omni-Sensory', desc: 'Web Audio API' },
        '21.5': { nombre: 'Singular Quantum', desc: 'FFT' },
        '24': { nombre: 'Quantum Core', desc: 'WebGL + Retro' }
    };

    function cambiarVersion(ver) {
        versionActual = ver;
        document.querySelectorAll('.ver-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.ver-btn[data-ver="${ver}"]`).classList.add('active');
        const info = VERSIONES[ver];
        document.getElementById('txt-version').textContent = `v${ver} · ${info.nombre}`;
        guardarLog(`📦 Versión ${ver} (${info.nombre})`, true);
    }
    document.querySelectorAll('.ver-btn').forEach(btn => {
        btn.addEventListener('click', () => cambiarVersion(btn.dataset.ver));
    });

    // ============================================================
    // 5. VISUALIZADORES
    // ============================================================
    document.querySelectorAll('.visual-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.visual-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            visualActual = btn.dataset.visual;
            guardarLog(`📺 Visualizador: ${visualActual}`, true);
        });
    });

    // ============================================================
    // 6. AUDIO CON FILTROS RETRO
    // ============================================================
    async function activarMicrofono() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new(window.AudioContext || window.webkitAudioContext)();
            const src = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = FFT_SIZE * 2;
            src.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            document.getElementById('txt-audio').textContent = 'ON';
            guardarLog('🎤 Micrófono activado', true);
        } catch (e) {
            alert('Permiso de micrófono denegado.');
        }
    }
    document.getElementById('btn-micro').addEventListener('click', activarMicrofono);

    function toggleSintetizador() {
        if (!audioContext) {
            audioContext = new(window.AudioContext || window.webkitAudioContext)();
        }
        synthActivo = !synthActivo;
        if (synthActivo) {
            document.getElementById('btn-synth').textContent = '■ Stop';
            // Crear cadena de audio con filtros
            const freqs = [frecuenciaBase, frecuenciaBase * 1.5, frecuenciaBase * 2];
            for (let i = 0; i < 3; i++) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = waveform;
                osc.frequency.value = freqs[i];
                gain.gain.value = 0.025;
                // Filtro low-pass
                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 2000;
                filter.Q.value = 1;
                osc.connect(gain);
                gain.connect(filter);
                filter.connect(audioContext.destination);
                osc.start();
                osciladores.push({ osc, gain, filter, base: freqs[i] });
            }
            guardarLog('♪ Sintetizador retro activado', true);
        } else {
            document.getElementById('btn-synth').textContent = '♪ Synth';
            osciladores.forEach(o => { try { o.osc.stop(); } catch (e) {} });
            osciladores = [];
            guardarLog('🔇 Sintetizador apagado');
        }
    }
    document.getElementById('btn-synth').addEventListener('click', toggleSintetizador);

    // Controles de filtro
    const filterFreqSlider = document.getElementById('filterFreq');
    const filterDisplay = document.getElementById('filterDisplay');
    const filterResSlider = document.getElementById('filterRes');
    const resDisplay = document.getElementById('resDisplay');

    filterFreqSlider.addEventListener('input', () => {
        const val = parseInt(filterFreqSlider.value);
        filterDisplay.textContent = val >= 1000 ? (val/1000).toFixed(1)+'k' : val;
        osciladores.forEach(o => {
            try { o.filter.frequency.setTargetAtTime(val, audioContext.currentTime, 0.05); } catch(e) {}
        });
    });
    filterResSlider.addEventListener('input', () => {
        const val = parseFloat(filterResSlider.value);
        resDisplay.textContent = val.toFixed(1);
        osciladores.forEach(o => {
            try { o.filter.Q.setTargetAtTime(val, audioContext.currentTime, 0.05); } catch(e) {}
        });
    });

    // ============================================================
    // 7. THREE.JS - ESCENA
    // ============================================================
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020308);
    scene.fog = new THREE.FogExp2(0x020308, 0.008);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        preserveDrawingBuffer: true,
        alpha: false
    });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);
    controls.minDistance = 2;
    controls.maxDistance = 20;

    // Post-procesado
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(container.clientWidth, container.clientHeight),
        0.2, 0.3, 0.1
    );
    composer.addPass(bloomPass);

    // ============================================================
    // 8. PARTÍCULAS
    // ============================================================
    geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);

    for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        positions[i3] = (Math.random() - 0.5) * 10;
        positions[i3 + 1] = 0;
        positions[i3 + 2] = 0;
        colors[i3] = 0.0;
        colors[i3 + 1] = 0.8 + Math.random() * 0.2;
        colors[i3 + 2] = 0.6 + Math.random() * 0.4;
        sizes[i] = 0.03 + Math.random() * 0.05;
        boids.push({
            pos: new THREE.Vector3(positions[i3], 0, 0),
            target1D: new THREE.Vector3((Math.random() - 0.5) * 10, 0, 0),
            target2D: new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, 0),
            target3D: new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6),
            vel: new THREE.Vector3((Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02),
            fase: Math.random() * Math.PI * 2,
            color: new THREE.Color(colors[i3], colors[i3 + 1], colors[i3 + 2])
        });
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    // Textura de partícula
    const canvasTex = document.createElement('canvas');
    canvasTex.width = 32;
    canvasTex.height = 32;
    const ctx = canvasTex.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const texture = new THREE.CanvasTexture(canvasTex);

    material = new THREE.PointsMaterial({
        size: 0.08,
        map: texture,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        vertexColors: true,
        opacity: 0.9,
        sizeAttenuation: true
    });

    pointsMesh = new THREE.Points(geometry, material);
    scene.add(pointsMesh);

    // Línea de referencia
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-8, 0, 0),
        new THREE.Vector3(8, 0, 0)
    ]);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.15 });
    refLine = new THREE.Line(lineGeo, lineMat);
    scene.add(refLine);

    // Terreno
    const meshGeo = new THREE.PlaneGeometry(16, 16, 30, 30);
    const meshMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.03 });
    terrain = new THREE.Mesh(meshGeo, meshMat);
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.y = -2.5;
    scene.add(terrain);

    // ============================================================
    // 9. CRISTALES
    // ============================================================
    const cristalGeo = new THREE.OctahedronGeometry(0.2, 0);

    function crearCristal() {
        const idx = Math.floor(Math.random() * COUNT);
        const posAttr = geometry.attributes.position;
        const p = new THREE.Vector3(
            posAttr.array[idx * 3],
            posAttr.array[idx * 3 + 1],
            posAttr.array[idx * 3 + 2]
        );
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.9 });
        const mesh = new THREE.Mesh(cristalGeo, mat);
        mesh.position.copy(p);
        mesh.userData = { baseY: p.y, rotSpeed: Math.random() * 0.02 + 0.01, phase: Math.random() * Math.PI * 2 };
        scene.add(mesh);
        cristales.push(mesh);
        if (audioContext) {
            try {
                const osc = audioContext.createOscillator();
                const g = audioContext.createGain();
                osc.frequency.value = 220 + Math.random() * 440;
                g.gain.setValueAtTime(0.05, audioContext.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.8);
                osc.connect(g);
                g.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.8);
            } catch (e) {}
        }
        guardarLog(`💎 Cristal #${cristales.length}`, true);
    }
    document.getElementById('btn-cristal').addEventListener('click', crearCristal);

    // ============================================================
    // 10. FIGURAS
    // ============================================================
    function cambiarFigura() {
        figuraIndex = (figuraIndex + 1) % FIGURAS.length;
        document.getElementById('btn-figure').textContent = `🌀 ${FIGURAS[figuraIndex]}`;
        guardarLog(`🔄 Figura: ${FIGURAS[figuraIndex]}`, true);
    }
    document.getElementById('btn-figure').addEventListener('click', cambiarFigura);

    // ============================================================
    // 11. OSCILOSCOPIO
    // ============================================================
    let oscActiveState = false;
    document.getElementById('btn-osc').addEventListener('click', () => {
        oscActiveState = !oscActiveState;
        oscCanvas.classList.toggle('active', oscActiveState);
        document.getElementById('btn-osc').textContent = oscActiveState ? '📊 Osc ON' : '📊 Osc';
        guardarLog(`📊 Osciloscopio: ${oscActiveState ? 'ON' : 'OFF'}`, true);
        if (oscActiveState) {
            oscCanvas.width = 300;
            oscCanvas.height = 100;
        }
    });

    function dibujarOsciloscopio() {
        if (!oscActiveState) return;
        const w = oscCanvas.width;
        const h = oscCanvas.height;
        oscCtx.fillStyle = 'rgba(0,0,0,0.9)';
        oscCtx.fillRect(0, 0, w, h);
        oscCtx.strokeStyle = '#00ffcc';
        oscCtx.lineWidth = 1.5;
        oscCtx.beginPath();
        const step = w / 64;
        for (let i = 0; i < 64; i++) {
            const x = i * step;
            const val = (nivelAudio / 100) * Math.sin(i * 0.5 + Date.now() * 0.005);
            const y = h/2 + val * 30;
            if (i === 0) oscCtx.moveTo(x, y);
            else oscCtx.lineTo(x, y);
        }
        oscCtx.stroke();
    }

    // ============================================================
    // 12. CAPTURA
    // ============================================================
    function capturarFoto() {
        composer.render();
        const link = document.createElement('a');
        link.download = `CYMATIC_${Date.now()}.png`;
        link.href = renderer.domElement.toDataURL('image/png');
        link.click();
        guardarLog('📷 Captura PNG', true);
    }

    // ============================================================
    // 13. TECLADO
    // ============================================================
    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        teclas[k] = true;
        if (e.key === '1') { modoDimension = 1;
            document.getElementById('txt-dimension').textContent = '1D · Filamento'; }
        if (e.key === '2') { modoDimension = 2;
            document.getElementById('txt-dimension').textContent = '2D · Plano'; }
        if (e.key === '3') { modoDimension = 3;
            document.getElementById('txt-dimension').textContent = '3D · Espacio'; }
        if (k === 'q') {
            modoCuantico = !modoCuantico;
            document.getElementById('txt-dimension').textContent = modoCuantico ? '⚛️ Cuántico' : '1D · Filamento';
            guardarLog(`⚛️ Cuántico: ${modoCuantico ? 'ON' : 'OFF'}`, true);
        }
        if (e.key === ' ') { e.preventDefault();
            crearCristal(); }
        if (k === 'p') { capturarFoto(); }
        if (k === 'f') { cambiarFigura(); }
        if (k === 'o') { document.getElementById('btn-osc').click(); }
    });
    window.addEventListener('keyup', (e) => { teclas[e.key.toLowerCase()] = false; });

    // ============================================================
    // 14. MOUSE
    // ============================================================
    window.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    });

    // ============================================================
    // 15. MATRIX RAIN (para visualizador)
    // ============================================================
    function initMatrix() {
        const cols = 40;
        matrixDrop = [];
        for (let i = 0; i < cols; i++) {
            matrixDrop.push({
                x: i * 20,
                y: Math.random() * 100,
                speed: 0.5 + Math.random() * 2,
                char: matrixChars[Math.floor(Math.random() * matrixChars.length)]
            });
        }
    }
    initMatrix();

    function drawMatrix(ctx, w, h) {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#00ffcc';
        ctx.font = '12px monospace';
        for (const drop of matrixDrop) {
            drop.y += drop.speed * (0.5 + nivelAudio/100);
            if (drop.y > h) { drop.y = -10; drop.char = matrixChars[Math.floor(Math.random() * matrixChars.length)]; }
            ctx.fillText(drop.char, drop.x, drop.y);
            // Sombra neón
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 8;
            ctx.fillText(drop.char, drop.x, drop.y);
            ctx.shadowBlur = 0;
        }
    }

    // ============================================================
    // 16. BUCLE DE ANIMACIÓN
    // ============================================================
    function animate() {
        requestAnimationFrame(animate);

        const now = performance.now();
        frameCount++;
        if (now >= lastTime + 1000) {
            document.getElementById('fps').textContent = Math.round((frameCount * 1000) / (now - lastTime));
            frameCount = 0;
            lastTime = now;
        }

        // Audio
        nivelAudio = 0;
        if (analyser && dataArray) {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
                if (i < FFT_SIZE) {
                    const h = (dataArray[i] / 255) * 100;
                    fftBars[i].style.height = Math.max(2, h) + '%';
                }
            }
            nivelAudio = sum / dataArray.length;
        }

        // Sintetizador
        if (synthActivo && osciladores.length > 0) {
            osciladores.forEach((o, idx) => {
                try {
                    const mod = (nivelAudio / 255) * 50;
                    o.osc.frequency.setTargetAtTime(o.base + mod, audioContext.currentTime, 0.1);
                } catch (e) {}
            });
        }

        // Partículas 3D (siempre activas)
        const posAttr = geometry.attributes.position;
        const arrayPos = posAttr.array;
        const time = now * 0.001;

        for (let i = 0; i < COUNT; i++) {
            const boid = boids[i];
            let target = new THREE.Vector3();
            const fig = FIGURAS[figuraIndex];

            if (modoCuantico) {
                const amp = 2.0 + (nivelAudio * 0.04);
                target.set(
                    Math.sin(time + boid.fase) * amp,
                    Math.cos(time * 1.3 + boid.fase) * amp,
                    Math.sin(time * 0.7 + boid.fase) * amp
                );
            } else if (modoDimension === 1) {
                const amp = 0.3 + (nivelAudio * 0.03);
                const x = boid.pos.x;
                target.x = x;
                if (fig === 'Chladni') {
                    target.y = Math.sin(x * 1.5 + time * 3) * amp * 2;
                } else if (fig === 'Lissajous') {
                    target.y = Math.sin(x * 2 + time * 2) * amp * 1.5;
                } else if (fig === 'Espiral') {
                    const r = 0.5 + (x + 5) / 10 * 2;
                    target.x = Math.cos(time * 0.5 + x) * r;
                    target.y = Math.sin(time * 0.5 + x) * r * 0.5;
                } else if (fig === 'Mandala') {
                    target.y = Math.sin(x * 2 + time * 2) * amp * 1.5;
                    target.z = Math.cos(x * 2 + time * 1.5) * amp * 0.8;
                } else if (fig === 'Aurora') {
                    target.y = Math.sin(x * 1.2 + time * 2.5) * amp * 2.5;
                    target.z = Math.cos(x * 1.8 + time * 1.8) * amp * 1.5;
                }
                target.z = 0;
            } else if (modoDimension === 2) {
                const rad = 2.5 + Math.sin(time + boid.fase) * (0.3 + nivelAudio * 0.02);
                const ang = boid.fase + time * 0.2;
                target.x = Math.cos(ang) * rad;
                target.y = Math.sin(ang) * rad;
                target.z = 0;
            } else {
                const factor = 1.0 + (nivelAudio * 0.05);
                target.copy(boid.target3D).multiplyScalar(factor);
            }

            if (teclas['w']) boid.vel.y += 0.002;
            if (teclas['s']) boid.vel.y -= 0.002;
            if (teclas['a']) boid.vel.x -= 0.002;
            if (teclas['d']) boid.vel.x += 0.002;

            boid.vel.clampLength(0, 0.12);
            boid.pos.lerp(target, 0.05);
            boid.pos.add(boid.vel);
            boid.vel.multiplyScalar(0.95);

            arrayPos[i * 3] = boid.pos.x;
            arrayPos[i * 3 + 1] = boid.pos.y;
            arrayPos[i * 3 + 2] = boid.pos.z;
        }
        posAttr.needsUpdate = true;

        // Rotación por mouse
        pointsMesh.rotation.y = mouseX * 0.5;
        pointsMesh.rotation.x = mouseY * 0.3;

        // Cristales
        cristales.forEach(c => {
            c.rotation.y += c.userData.rotSpeed;
            c.rotation.x += 0.005;
            c.position.y = c.userData.baseY + Math.sin(time * 2 + c.userData.phase) * 0.15 + (nivelAudio * 0.01);
        });

        // Terreno
        const terrainPos = terrain.geometry.attributes.position;
        for (let i = 0; i < terrainPos.count; i++) {
            const x = terrainPos.array[i * 3];
            const z = terrainPos.array[i * 3 + 1];
            const d = Math.sqrt(x * x + z * z);
            terrainPos.array[i * 3 + 2] = Math.sin(d * 0.8 - time * 2) * (0.08 + nivelAudio * 0.001);
        }
        terrainPos.needsUpdate = true;

        controls.update();
        composer.render();

        // Dibujar visualizador retro (si está activo)
        if (visualActual === 'matrix') {
            const w = container.clientWidth;
            const h = container.clientHeight;
            // Matrix Rain se dibuja en un canvas overlay (usamos el canvas del osciloscopio para simplicidad)
            // En esta demo, lo dibujamos en el canvas del osciloscopio si está activo, sino en uno temporal
            if (oscActiveState) {
                drawMatrix(oscCtx, oscCanvas.width, oscCanvas.height);
            }
        }

        // Osciloscopio
        dibujarOsciloscopio();
    }

    // ============================================================
    // 17. REDIMENSIONAMIENTO
    // ============================================================
    const resizeObserver = new ResizeObserver(() => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        composer.setSize(w, h);
    });
    resizeObserver.observe(container);

    window.addEventListener('resize', () => {
        if (oscActiveState) {
            oscCanvas.width = 300;
            oscCanvas.height = 100;
        }
    });

    // ============================================================
    // 18. LIMPIAR LOGS
    // ============================================================
    document.getElementById('btn-clear-log').addEventListener('click', () => {
        logArea.innerHTML = '';
        guardarLog('🗑️ Logs limpiados');
    });

    // ============================================================
    // 19. INICIO
    // ============================================================
    cambiarVersion('24');
    guardarLog('✅ CYMATIC RETRO EDITION cargada', true);
    guardarLog('🎛️ Visualizadores: Espectro, Partículas, Matrix, Vectores, Ondas', true);
    guardarLog('🎹 Teclas: 1-2-3 (Dim), Q (Cuántico), Espacio (Cristal), P (Foto), F (Figura), O (Osciloscopio)', true);

    // Inicializar osciloscopio canvas
    oscCanvas.width = 300;
    oscCanvas.height = 100;
    oscCanvas.classList.remove('active');

    animate();
    </script>
</body>
</html>
