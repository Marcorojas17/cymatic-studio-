    <style>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT: MOTOR COMPLETO ===== -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // 1. IMPORTACIONES
        // ============================================================
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ============================================================
        // 2. ESTADO GLOBAL
        // ============================================================
        let modoDimension = 1; // 1, 2, 3
        let modoCuantico = false;
        let figuraActual = 0; // 0=Chladni, 1=Lissajous, 2=Espiral, 3=Mandala
        const FIGURAS = ['Chladni', 'Lissajous', 'Espiral', 'Mandala'];

        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let nivelAudio = 0;
        let synthActivo = false;
        let osciladores = [];
        let waveform = 'sine';
        let frecuenciaBase = 440;

        let scene, camera, renderer, composer, controls;
        let pointsMesh, terrain, refLine;
        let geometry, material;
        const COUNT = 3000;
        let boids = [];
        let cristales = [];
        let figurePhase = 0;

        let mouseX = 0,
            mouseY = 0;
        let teclas = {};
        let lastTime = performance.now();
        let frameCount = 0;

        // ============================================================
        // 3. DOM REFERENCIAS
        // ============================================================
        const canvas = document.getElementById('canvas-kronos');
        const logArea = document.getElementById('logArea');
        const fftContainer = document.getElementById('fftMeter');
        const FFT_SIZE = 24;
        for (let i = 0; i < FFT_SIZE; i++) {
            const bar = document.createElement('div');
            bar.className = 'fft-bar';
            fftContainer.appendChild(bar);
        }
        const fftBars = fftContainer.querySelectorAll('.fft-bar');

        function guardarLog(msg, highlight = false) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML =
                `<span class="time">[${time}]</span> ${highlight ? '<span class="highlight">' + msg + '</span>' : msg}`;
            logArea.prepend(entry);
            if (logArea.children.length > 50) {
                logArea.removeChild(logArea.lastChild);
            }
        }
        guardarLog('🚀 Motor iniciado', true);

        // ============================================================
        // 4. AUDIO
        // ============================================================
        async function activarMicrofono() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
                const src = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = FFT_SIZE * 2;
                src.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                document.getElementById('txt-audio').textContent = 'ON';
                guardarLog('🎤 Micrófono activado', true);
            } catch (e) {
                alert('Permiso de micrófono denegado.');
            }
        }
        document.getElementById('btn-micro').addEventListener('click', activarMicrofono);

        function toggleSintetizador() {
            if (!audioContext) {
                audioContext = new(window.AudioContext || window.webkitAudioContext)();
            }
            synthActivo = !synthActivo;
            if (synthActivo) {
                document.getElementById('btn-synth').textContent = '■ DETENER';
                // Crear 3 osciladores con la forma de onda seleccionada
                const freqs = [frecuenciaBase, frecuenciaBase * 1.5, frecuenciaBase * 2];
                for (let i = 0; i < 3; i++) {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = waveform;
                    osc.frequency.value = freqs[i];
                    gain.gain.value = 0.03;
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start();
                    osciladores.push({ osc, gain, base: freqs[i] });
                }
                guardarLog('♪ Sintetizador activado (ondas: ' + waveform + ')', true);
            } else {
                document.getElementById('btn-synth').textContent = '♪ SINTETIZADOR';
                osciladores.forEach(o => { try { o.osc.stop(); } catch (e) {} });
                osciladores = [];
                guardarLog('🔇 Sintetizador apagado');
            }
        }
        document.getElementById('btn-synth').addEventListener('click', toggleSintetizador);

        // Selector de forma de onda
        document.querySelectorAll('[data-wave]').forEach(btn => {
            btn.addEventListener('click', () => {
                waveform = btn.dataset.wave;
                // Actualizar osciladores existentes
                osciladores.forEach(o => { try { o.osc.type = waveform; } catch (e) {} });
                guardarLog('🎵 Forma de onda: ' + waveform);
            });
        });

        // Selector de frecuencia Solfeggio
        document.querySelectorAll('.solfeggio-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.solfeggio-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const freq = parseFloat(btn.dataset.freq);
                frecuenciaBase = freq;
                document.getElementById('freqSlider').value = freq;
                document.getElementById('freqDisplay').textContent = freq + ' Hz';
                // Actualizar osciladores
                osciladores.forEach((o, i) => {
                    try {
                        o.osc.frequency.setTargetAtTime(freq * (1 + i * 0.5), audioContext.currentTime, 0.1);
                        o.base = freq * (1 + i * 0.5);
                    } catch (e) {}
                });
                guardarLog(`🔮 Frecuencia Solfeggio: ${freq}Hz`, true);
            });
        });

        // Slider de frecuencia
        const freqSlider = document.getElementById('freqSlider');
        const freqDisplay = document.getElementById('freqDisplay');
        freqSlider.addEventListener('input', () => {
            frecuenciaBase = parseFloat(freqSlider.value);
            freqDisplay.textContent = frecuenciaBase + ' Hz';
            // Actualizar osciladores
            osciladores.forEach((o, i) => {
                try {
                    o.osc.frequency.setTargetAtTime(frecuenciaBase * (1 + i * 0.5), audioContext.currentTime, 0.1);
                    o.base = frecuenciaBase * (1 + i * 0.5);
                } catch (e) {}
            });
            // Desactivar Solfeggio activo
            document.querySelectorAll('.solfeggio-btn').forEach(b => b.classList.remove('active'));
        });

        // ============================================================
        // 5. THREE.JS - ESCENA
        // ============================================================
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020308);
        scene.fog = new THREE.FogExp2(0x020308, 0.008);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 8);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            preserveDrawingBuffer: true,
            alpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Controles de órbita
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.minDistance = 2;
        controls.maxDistance = 20;

        // Post-procesado (Bloom)
        composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.2, 0.3, 0.1
        );
        composer.addPass(bloomPass);

        // ============================================================
        // 6. PARTÍCULAS
        // ============================================================
        geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const colors = new Float32Array(COUNT * 3);
        const sizes = new Float32Array(COUNT);

        for (let i = 0; i < COUNT; i++) {
            const i3 = i * 3;
            // Posiciones iniciales en 1D
            positions[i3] = (Math.random() - 0.5) * 10;
            positions[i3 + 1] = 0;
            positions[i3 + 2] = 0;

            // Colores aleatorios (base cyan)
            colors[i3] = 0.0;
            colors[i3 + 1] = 0.8 + Math.random() * 0.2;
            colors[i3 + 2] = 0.6 + Math.random() * 0.4;

            sizes[i] = 0.03 + Math.random() * 0.05;

            // Datos de cada partícula (boid)
            boids.push({
                pos: new THREE.Vector3(positions[i3], 0, 0),
                target1D: new THREE.Vector3((Math.random() - 0.5) * 10, 0, 0),
                target2D: new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, 0),
                target3D: new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6),
                vel: new THREE.Vector3((Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.02, (Math.random() - 0.5) *
                    0.02),
                fase: Math.random() * Math.PI * 2,
                color: new THREE.Color(colors[i3], colors[i3 + 1], colors[i3 + 2])
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Textura de partícula (glow circular)
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 32;
        canvasTexture.height = 32;
        const ctx = canvasTexture.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 32);
        const texture = new THREE.CanvasTexture(canvasTexture);

        material = new THREE.PointsMaterial({
            size: 0.08,
            map: texture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.9,
            sizeAttenuation: true
        });

        pointsMesh = new THREE.Points(geometry, material);
        scene.add(pointsMesh);

        // Línea de referencia 1D
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-8, 0, 0),
            new THREE.Vector3(8, 0, 0)
        ]);
        const lineMat = new THREE.LineBasicMaterial({
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.15
        });
        refLine = new THREE.Line(lineGeo, lineMat);
        scene.add(refLine);

        // Terreno de malla
        const meshGeo = new THREE.PlaneGeometry(16, 16, 30, 30);
        const meshMat = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.03
        });
        terrain = new THREE.Mesh(meshGeo, meshMat);
        terrain.rotation.x = -Math.PI / 2;
        terrain.position.y = -2.5;
        scene.add(terrain);

        // ============================================================
        // 7. CRISTALES
        // ============================================================
        const cristalGeo = new THREE.OctahedronGeometry(0.2, 0);

        function crearCristal() {
            const idx = Math.floor(Math.random() * COUNT);
            const posAttr = geometry.attributes.position;
            const p = new THREE.Vector3(
                posAttr.array[idx * 3],
                posAttr.array[idx * 3 + 1],
                posAttr.array[idx * 3 + 2]
            );
            const mat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.9
            });
            const mesh = new THREE.Mesh(cristalGeo, mat);
            mesh.position.copy(p);
            mesh.userData = {
                baseY: p.y,
                rotSpeed: Math.random() * 0.02 + 0.01,
                phase: Math.random() * Math.PI * 2
            };
            scene.add(mesh);
            cristales.push(mesh);

            // Sonido al crear
            if (audioContext) {
                try {
                    const osc = audioContext.createOscillator();
                    const g = audioContext.createGain();
                    osc.frequency.value = 220 + Math.random() * 440;
                    g.gain.setValueAtTime(0.05, audioContext.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.8);
                    osc.connect(g);
                    g.connect(audioContext.destination);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.8);
                } catch (e) {}
            }
            guardarLog(`💎 Cristal #${cristales.length} en [${p.x.toFixed(2)}, ${p.y.toFixed(2)}]`, true);
        }

        // ============================================================
        // 8. CAMBIO DE FIGURA
        // ============================================================
        let figuraIndex = 0;

        function cambiarFigura() {
            figuraIndex = (figuraIndex + 1) % FIGURAS.length;
            document.getElementById('btn-figure').textContent = `🌀 ${FIGURAS[figuraIndex]}`;
            guardarLog(`🔄 Figura: ${FIGURAS[figuraIndex]}`, true);
        }
        document.getElementById('btn-figure').addEventListener('click', cambiarFigura);

        // ============================================================
        // 9. CAPTURA DE PANTALLA
        // ============================================================
        function capturarFoto() {
            composer.render();
            const link = document.createElement('a');
            link.download = `CYMATIC_${Date.now()}.png`;
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
            guardarLog('📷 Captura PNG guardada', true);
        }

        // ============================================================
        // 10. TECLADO
        // ============================================================
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            teclas[k] = true;

            if (e.key === '1') { modoDimension = 1;
                document.getElementById('txt-dimension').textContent = '1D · Filamento'; }
            if (e.key === '2') { modoDimension = 2;
                document.getElementById('txt-dimension').textContent = '2D · Plano'; }
            if (e.key === '3') { modoDimension = 3;
                document.getElementById('txt-dimension').textContent = '3D · Espacio'; }
            if (k === 'q') {
                modoCuantico = !modoCuantico;
                document.getElementById('txt-dimension').textContent = modoCuantico ? '⚛️ Cuántico' : '1D · Filamento';
                guardarLog(`⚛️ Cuántico: ${modoCuantico ? 'ON' : 'OFF'}`, true);
            }
            if (e.key === ' ') { e.preventDefault();
                crearCristal(); }
            if (k === 'p') { capturarFoto(); }
            if (k === 'f') { cambiarFigura(); }
        });
        window.addEventListener('keyup', (e) => { teclas[e.key.toLowerCase()] = false; });

        // ============================================================
        // 11. MOUSE
        // ============================================================
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // ============================================================
        // 12. BUCLE DE ANIMACIÓN
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            frameCount++;
            if (now >= lastTime + 1000) {
                document.getElementById('fps').textContent = Math.round((frameCount * 1000) / (now - lastTime));
                frameCount = 0;
                lastTime = now;
            }

            // Audio
            nivelAudio = 0;
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                    if (i < FFT_SIZE) {
                        const h = (dataArray[i] / 255) * 100;
                        fftBars[i].style.height = Math.max(2, h) + '%';
                    }
                }
                nivelAudio = sum / dataArray.length;
            }

            // Modulación de osciladores por audio
            if (synthActivo && osciladores.length > 0) {
                osciladores.forEach((o, idx) => {
                    try {
                        const mod = (nivelAudio / 255) * 50;
                        o.osc.frequency.setTargetAtTime(o.base + mod, audioContext.currentTime, 0.1);
                    } catch (e) {}
                });
            }

            // Actualizar partículas
            const posAttr = geometry.attributes.position;
            const arrayPos = posAttr.array;
            const time = now * 0.001;

            for (let i = 0; i < COUNT; i++) {
                const boid = boids[i];
                let target = new THREE.Vector3();

                // Selección de figura
                const fig = FIGURAS[figuraIndex];

                if (modoCuantico) {
                    const amp = 2.0 + (nivelAudio * 0.04);
                    target.set(
                        Math.sin(time + boid.fase) * amp,
                        Math.cos(time * 1.3 + boid.fase) * amp,
                        Math.sin(time * 0.7 + boid.fase) * amp
                    );
                } else if (modoDimension === 1) {
                    // 1D: Filamento con perturbación
                    const amp = 0.3 + (nivelAudio * 0.03);
                    const x = boid.pos.x;
                    target.x = x;
                    if (fig === 'Chladni') {
                        target.y = Math.sin(x * 1.5 + time * 3) * amp * 2;
                    } else if (fig === 'Lissajous') {
                        target.y = Math.sin(x * 2 + time * 2) * amp * 1.5;
                    } else if (fig === 'Espiral') {
                        const r = 0.5 + (x + 5) / 10 * 2;
                        target.x = Math.cos(time * 0.5 + x) * r;
                        target.y = Math.sin(time * 0.5 + x) * r * 0.5;
                    } else { // Mandala
                        target.y = Math.sin(x * 2 + time * 2) * amp * 1.5;
                        target.z = Math.cos(x * 2 + time * 1.5) * amp * 0.8;
                    }
                    target.z = 0;
                } else if (modoDimension === 2) {
                    // 2D: Plano
                    const rad = 2.5 + Math.sin(time + boid.fase) * (0.3 + nivelAudio * 0.02);
                    const ang = boid.fase + time * 0.2;
                    target.x = Math.cos(ang) * rad;
                    target.y = Math.sin(ang) * rad;
                    target.z = 0;
                } else {
                    // 3D: Nube
                    const factor = 1.0 + (nivelAudio * 0.05);
                    target.copy(boid.target3D).multiplyScalar(factor);
                }

                // WASD
                if (teclas['w']) boid.vel.y += 0.002;
                if (teclas['s']) boid.vel.y -= 0.002;
                if (teclas['a']) boid.vel.x -= 0.002;
                if (teclas['d']) boid.vel.x += 0.002;

                boid.vel.clampLength(0, 0.12);
                boid.pos.lerp(target, 0.05);
                boid.pos.add(boid.vel);
                boid.vel.multiplyScalar(0.95);

                arrayPos[i * 3] = boid.pos.x;
                arrayPos[i * 3 + 1] = boid.pos.y;
                arrayPos[i * 3 + 2] = boid.pos.z;

                // Color dinámico por audio
                const color = boid.color;
                const audioFactor = Math.min(1, nivelAudio / 80);
                const r = 0.0 + audioFactor * 0.8;
                const g = 0.8 + (1 - audioFactor) * 0.2;
                const b = 0.6 + (1 - audioFactor) * 0.4;
                const posAttrColor = geometry.attributes.color;
                if (posAttrColor) {
                    posAttrColor.array[i * 3] = r;
                    posAttrColor.array[i * 3 + 1] = g;
                    posAttrColor.array[i * 3 + 2] = b;
                }
            }
            posAttr.needsUpdate = true;
            if (geometry.attributes.color) geometry.attributes.color.needsUpdate = true;

            // Rotación de partículas por mouse
            pointsMesh.rotation.y = mouseX * 0.5;
            pointsMesh.rotation.x = mouseY * 0.3;

            // Cristales
            cristales.forEach(c => {
                c.rotation.y += c.userData.rotSpeed;
                c.rotation.x += 0.005;
                c.position.y = c.userData.baseY + Math.sin(time * 2 + c.userData.phase) * 0.15 + (nivelAudio * 0.01);
            });

            // Terreno
            const terrainPos = terrain.geometry.attributes.position;
            for (let i = 0; i < terrainPos.count; i++) {
                const x = terrainPos.array[i * 3];
                const z = terrainPos.array[i * 3 + 1];
                const d = Math.sqrt(x * x + z * z);
                terrainPos.array[i * 3 + 2] = Math.sin(d * 0.8 - time * 2) * (0.08 + nivelAudio * 0.001);
            }
            terrainPos.needsUpdate = true;

            controls.update();
            composer.render();
        }

        // ============================================================
        // 13. REDIMENSIONAMIENTO
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // ============================================================
        // 14. LIMPIAR LOGS
        // ============================================================
        document.getElementById('btn-clear-log').addEventListener('click', () => {
            logArea.innerHTML = '';
            guardarLog('🗑️ Logs limpiados');
        });

        // ============================================================
        // 15. INICIO
        // ============================================================
        guardarLog('✅ Motor CYMATIC STUDIO PRO v24 cargado', true);
        guardarLog('🎛️ Figuras: Chladni, Lissajous, Espiral, Mandala');
        guardarLog('🔮 Frecuencias Solfeggio disponibles (432-963Hz)');
        guardarLog('🎹 Teclas: 1-2-3 (dimensiones), Q (cuántico), Espacio (cristal), P (foto), F (figura)');

        animate();

        // Exponer funciones globales para depuración
        window.crearCristal = crearCristal;
        window.cambiarFigura = cambiarFigura;
    </script>
</body>
</html>
